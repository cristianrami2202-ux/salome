<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Salomé 💌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fondo de corazones flotantes -->
<div id="corazones" aria-hidden="true"></div>

<!-- ESCENA 1: la carta -->
<section id="escena-carta" class="escena activa">
  <p class="pista">Tienes una carta, Salomé 💌</p>
  <button id="sobre" class="sobre" aria-label="Abrir la carta">
    <span class="sobre-fondo"></span>
    <span class="sobre-tapa"></span>
    <span class="papel">
      <span class="papel-texto">Para<br><b>Salomé</b></span>
    </span>
    <span class="sobre-frente"></span>
    <span class="sello">♥</span>
  </button>
  <p class="toca">Toca el sobre para abrirlo</p>
</section>

<!-- ESCENA 2: el oso -->
<section id="escena-oso" class="escena">
  <div class="burbuja" id="burbuja">
    <span id="texto"></span><span class="cursor">|</span>
  </div>

  <div class="oso-zona">
    <svg id="oso" class="oso" viewBox="0 0 300 340" role="img" aria-label="Oso de peluche">
      <!-- sombra -->
      <ellipse cx="150" cy="328" rx="85" ry="9" fill="rgba(0,0,0,.18)"/>

      <!-- orejas -->
      <circle cx="82" cy="62" r="30" fill="#b9825a"/>
      <circle cx="82" cy="62" r="16" fill="#f4b6c2"/>
      <circle cx="218" cy="62" r="30" fill="#b9825a"/>
      <circle cx="218" cy="62" r="16" fill="#f4b6c2"/>

      <!-- cuerpo -->
      <g id="cuerpo">
        <ellipse cx="150" cy="238" rx="86" ry="84" fill="#c8916a"/>
        <ellipse cx="150" cy="248" rx="52" ry="58" fill="#f1d3b3"/>
        <!-- patas de abajo -->
        <ellipse cx="102" cy="314" rx="30" ry="17" fill="#b9825a"/>
        <ellipse cx="198" cy="314" rx="30" ry="17" fill="#b9825a"/>
        <ellipse cx="102" cy="316" rx="16" ry="8" fill="#f4b6c2"/>
        <ellipse cx="198" cy="316" rx="16" ry="8" fill="#f4b6c2"/>
      </g>

      <!-- brazo izquierdo (saluda) -->
      <g id="brazo-izq" class="brazo">
        <ellipse cx="68" cy="222" rx="20" ry="42" fill="#b9825a" transform="rotate(18 68 222)"/>
        <circle cx="54" cy="184" r="13" fill="#f4b6c2"/>
      </g>
      <!-- brazo derecho -->
      <g id="brazo-der">
        <ellipse cx="232" cy="236" rx="20" ry="42" fill="#b9825a" transform="rotate(-18 232 236)"/>
        <circle cx="244" cy="200" r="13" fill="#f4b6c2"/>
      </g>

      <!-- corazón en la panza -->
      <path id="corazon-panza" d="M150 262 C150 262 120 242 128 224 C134 212 150 216 150 228 C150 216 166 212 172 224 C180 242 150 262 150 262Z" fill="#ff4d79"/>

      <!-- cabeza -->
      <g id="cabeza">
        <circle cx="150" cy="118" r="76" fill="#c8916a"/>
        <!-- mejillas -->
        <ellipse cx="96" cy="140" rx="15" ry="9" fill="#ff9bb3" opacity=".75"/>
        <ellipse cx="204" cy="140" rx="15" ry="9" fill="#ff9bb3" opacity=".75"/>
        <!-- hocico -->
        <ellipse cx="150" cy="140" rx="36" ry="28" fill="#f1d3b3"/>
        <ellipse cx="150" cy="128" rx="11" ry="8" fill="#4a2b1b"/>
        <!-- boca -->
        <path id="boca" d="M138 148 Q150 160 162 148" fill="none" stroke="#4a2b1b" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M150 136 L150 146" stroke="#4a2b1b" stroke-width="3" stroke-linecap="round"/>
        <!-- ojos -->
        <g id="ojos">
          <circle cx="118" cy="104" r="12" fill="#fff"/>
          <circle cx="182" cy="104" r="12" fill="#fff"/>
          <circle id="pupila-izq" cx="118" cy="104" r="7" fill="#2a1810"/>
          <circle id="pupila-der" cx="182" cy="104" r="7" fill="#2a1810"/>
          <circle id="brillo-izq" cx="121" cy="101" r="2.4" fill="#fff"/>
          <circle id="brillo-der" cx="185" cy="101" r="2.4" fill="#fff"/>
          <rect id="parpado-izq" x="104" y="90" width="28" height="28" rx="14" fill="#c8916a" class="parpado"/>
          <rect id="parpado-der" x="168" y="90" width="28" height="28" rx="14" fill="#c8916a" class="parpado"/>
        </g>
        <!-- lazo -->
        <g id="lazo">
          <path d="M150 48 L124 34 L124 62 Z" fill="#ff4d79"/>
          <path d="M150 48 L176 34 L176 62 Z" fill="#ff4d79"/>
          <circle cx="150" cy="48" r="8" fill="#d6204f"/>
        </g>
      </g>
    </svg>
    <p class="hint" id="hint">Tócame, haz clic en mi panza o mueve el mouse 🐻</p>
  </div>

  <div class="botones">
    <button id="btn-siguiente" class="btn">Siguiente 💕</button>
    <button id="btn-abrazo" class="btn btn-sec">Abrazo 🤗</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
